<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>InventarioPro | Proveedores</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- Custom Styles -->
    <link href="../css/styles.css" rel="stylesheet" />
    <style>
        #em_photo { height: 40px; width: 40px; border-radius: 5px; object-fit: cover; }
    </style>
</head>
<body class="sb-nav-fixed">

    <!-- Top Navbar -->
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark" id="topbar">
        <a class="navbar-brand" href="../index.html">
            <i class="fas fa-box-open mr-2"></i> InventarioPro
        </a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 text-white" id="sidebarToggle" href="#"><i class="fas fa-bars"></i></button>
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a class="nav-link text-white" href="../index.html"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
            </li>
        </ul>
    </nav>

    <div id="layoutSidenav">
        <!-- Sidebar -->
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <a class="nav-link" href="../index.html">
                            <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                            Dashboard
                        </a>
                        <a class="nav-link bg-primary text-white" href="pos.html">
                            <div class="sb-nav-link-icon text-white"><i class="fas fa-desktop"></i></div>
                            <b>POS</b>
                        </a>
                        <!-- ... other links ... -->
                    </div>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid">
                    <ol class="breadcrumb mt-3 mb-4">
                        <li class="breadcrumb-item"><a href="../index.html">Dashboard</a></li>
                        <li class="breadcrumb-item active">Todos los Proveedores</li>
                    </ol>

                    <div class="row card container ml-0 border-primary shadow mx-auto" style="width: 100%;">
                        <div class="card-header text-primary d-flex justify-content-between align-items-center" style="font-size: 20px; font-weight:700;">
                            <div><i class="fas fa-truck mr-2"></i> Todos los Proveedores</div>
                            <button class="btn btn-primary btn-sm" id="btnNewSupplier"><i class="fas fa-plus"></i> Agregar Nuevo</button>
                        </div>
                        <div class="card-body pt-3">
                            <div class="table-responsive">
                                <label class="d-inline font-weight-bold">Buscar : </label>
                                <input type="text" id="searchInput" class="form-control d-inline mb-3" style="width:250px;" placeholder="Buscar por nombre o empresa">
                                
                                <table class="table table-bordered table-striped table-hover border-primary" width="100%" cellspacing="0">
                                    <thead>
                                        <tr class="bg-info text-white">
                                            <th>ID</th>
                                            <th>Nombre / Razón Social</th>
                                            <th>Contacto</th>
                                            <th>Email</th>
                                            <th>Teléfono</th>
                                            <th>Estado</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody id="suppliersTableBody">
                                        <tr><td colspan="7" class="text-center">Cargando datos...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card-footer small text-muted text-right">Módulo de Proveedores</div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts Bootstrap / jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Sidebar Toggle Logic -->
    <script>
        (function($) {
            "use strict";
            $("#sidebarToggle").on("click", function(e) {
                e.preventDefault();
                $("body").toggleClass("sb-sidenav-toggled");
            });
        })(jQuery);
    </script>
    
    <script type="module" src="../js/proveedores.js"></script>
</body>
</html>
