<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventarioPro | Punto de Venta</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Diseño específico para POS */
    .pos-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      height: 100vh;
      background: var(--bg-color);
    }
    .pos-main { padding: 20px; display: flex; flex-direction: column; overflow: hidden; }
    .pos-sidebar { 
      background: var(--surface); 
      border-left: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
    }
    .scanner-box {
      background: rgba(0,0,0,0.2);
      border: 2px dashed var(--accent-blue);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .scanner-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 24px;
      text-align: center;
      outline: none;
      width: 100%;
    }
    .search-results {
      flex: 1;
      overflow-y: auto;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 12px;
    }
    .search-item {
      background: var(--surface);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: 0.2s;
    }
    .search-item:hover { transform: translateY(-2px); border-color: var(--accent-blue); }
    
    /* Ticket */
    .ticket-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .ticket-body { flex: 1; overflow-y: auto; padding: 20px; }
    .ticket-footer { padding: 20px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(255,255,255,0.05); }
    
    .ticket-item {
      display: flex; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
    .qty-controls { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 4px; }
    .qty-controls button { background: transparent; border: none; color: #fff; width: 24px; height: 24px; cursor: pointer; border-radius: 50%; }
    .qty-controls button:hover { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>
<div class="pos-layout">
  
  <div class="pos-main">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:12px">
        <a href="../index.html" class="btn-icon" style="color:var(--text-muted)"><i class="fa fa-arrow-left"></i></a>
        <h2><i class="fa fa-cash-register" style="color:var(--accent-blue)"></i> Punto de Venta</h2>
      </div>
      <div id="conn-status" style="font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--accent-green)"></div> En línea
      </div>
    </div>

    <div class="scanner-box">
      <i class="fa fa-barcode" style="font-size:32px;color:var(--text-muted);margin-bottom:12px"></i>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">Escanea un código de barras o escribe para buscar</p>
      <input type="text" id="pos-input" placeholder="Lector listo..." autocomplete="off" autofocus>
    </div>

    <div class="search-results" id="pos-results" style="display:none">
      <!-- Resultados visuales de búsqueda manual -->
    </div>
  </div>

  <div class="pos-sidebar">
    <div class="ticket-header">
      <h3 style="font-size:16px;font-weight:700">Ticket de Venta</h3>
      <p style="font-size:12px;color:var(--text-muted)" id="ticket-date">--/--/----</p>
    </div>
    
    <div class="ticket-body" id="ticket-items">
      <div style="text-align:center;color:var(--text-muted);margin-top:40px">
        <i class="fa fa-shopping-basket" style="font-size:48px;opacity:0.2;margin-bottom:16px"></i>
        <p>Aún no hay productos<br>en la venta actual.</p>
      </div>
    </div>

    <div class="ticket-footer">
      <div style="display:flex;justify-content:space-between;font-size:28px;font-weight:700;margin-bottom:16px;color:var(--accent-green)">
        <span>Total</span>
        <span id="ticket-total">$0.00</span>
      </div>
      
      <div class="form-group" style="margin-bottom:16px">
        <label class="form-label" style="font-size:11px">Asignar Cliente (Opcional)</label>
        <select class="form-control" id="f-cliente">
          <option value="">Consumidor Final</option>
        </select>
      </div>

      <button class="btn btn-primary" style="width:100%;height:50px;font-size:16px;justify-content:center" id="btn-pay">
        <i class="fa fa-credit-card"></i> Cobrar e Imprimir
      </button>
    </div>
  </div>

</div>

<script src="../js/api.js"></script>
<script>
  if (!Auth.isLoggedIn()) { window.location.href = '../index.html'; }

  document.getElementById('ticket-date').textContent = new Date().toLocaleString();
  
  let cart = [];
  let searchTimer = null;
  const input = document.getElementById('pos-input');
  const resultsBox = document.getElementById('pos-results');

  document.addEventListener('DOMContentLoaded', async () => {
    // Mantener focus en el input
    document.addEventListener('click', (e) => {
      if(!e.target.closest('.pos-sidebar') && e.target.tagName !== 'BUTTON') {
        input.focus();
      }
    });

    // Cargar clientes
    try {
      const res = await apiFetch('/entities?tipo=Cliente');
      const cliSelect = document.getElementById('f-cliente');
      res.data.filter(e => e.tipo === 'Cliente').forEach(p => {
        cliSelect.innerHTML += `<option value="${p._id}">${p.nombre}</option>`;
      });
    } catch(e) {}

    // Input handler para Escáner o Búsqueda
    input.addEventListener('input', (e) => {
      const q = e.target.value.trim();
      clearTimeout(searchTimer);
      
      if (!q) { resultsBox.style.display = 'none'; return; }

      searchTimer = setTimeout(async () => {
        try {
          // Primero intentamos buscar rápido (Autocompletado)
          const res = await apiFetch(`/products/buscar?q=${encodeURIComponent(q)}`);
          if (res.data && res.data.length > 0) {
            
            // Si es exactamente 1 resultado y el input coincide exacto con el código de barras (escáner)
            if (res.data.length === 1 && res.data[0].codigo_barras === q) {
              const p = res.data[0];
              // Necesitamos su precio de venta, haremos un fetch completo
              const pRes = await apiFetch(`/products/${p._id}`);
              addToCart(pRes.data.producto);
              input.value = '';
              resultsBox.style.display = 'none';
              return;
            }

            // Si son varios, mostramos resultados visuales
            resultsBox.innerHTML = res.data.map(p => `
              <div class="search-item" onclick="fetchAndAdd('${p._id}')">
                <div>
                  <div style="font-weight:700">${p.nombre}</div>
                  <div style="font-size:12px;color:var(--text-muted)">SKU: ${p.sku}</div>
                </div>
                <div style="color:var(--accent-blue)"><i class="fa fa-plus"></i></div>
              </div>
            `).join('');
            resultsBox.style.display = 'block';
          } else {
            resultsBox.style.display = 'none';
          }
        } catch(err) { console.error(err); }
      }, 200); // 200ms debounce
    });

    // Enter para prevenir submit de formularios (si lo hubiera)
    input.addEventListener('keypress', (e) => {
      if(e.key === 'Enter') e.preventDefault();
    });

    document.getElementById('btn-pay').addEventListener('click', processSale);
  });

  async function fetchAndAdd(id) {
    try {
      const res = await apiFetch(`/products/${id}`);
      addToCart(res.data.producto);
      input.value = '';
      resultsBox.style.display = 'none';
      input.focus();
    } catch(e) { alert('Error cargando producto'); }
  }

  function addToCart(p) {
    const existing = cart.find(i => i.product_id === p._id);
    if (existing) {
      existing.quantity++;
    } else {
      cart.push({
        product_id: p._id,
        name: p.nombre,
        quantity: 1,
        unit_price: p.precio_venta || 0
      });
    }
    renderCart();
  }

  function renderCart() {
    const tBody = document.getElementById('ticket-items');
    if (cart.length === 0) {
      tBody.innerHTML = `
        <div style="text-align:center;color:var(--text-muted);margin-top:40px">
          <i class="fa fa-shopping-basket" style="font-size:48px;opacity:0.2;margin-bottom:16px"></i>
          <p>Aún no hay productos<br>en la venta actual.</p>
        </div>`;
      document.getElementById('ticket-total').textContent = '$0.00';
      return;
    }

    let total = 0;
    tBody.innerHTML = cart.map((item, index) => {
      const sub = item.quantity * item.unit_price;
      total += sub;
      return `
        <div class="ticket-item">
          <div style="flex:1">
            <div style="font-weight:700;font-size:14px;margin-bottom:8px">${item.name}</div>
            <div style="color:var(--text-muted);font-size:12px">$${item.unit_price.toFixed(2)} c/u</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
            <div style="font-weight:700;color:var(--accent-green)">$${sub.toFixed(2)}</div>
            <div class="qty-controls">
              <button onclick="updateQty(${index}, -1)"><i class="fa fa-minus" style="font-size:10px"></i></button>
              <span style="font-size:14px;font-weight:700;width:20px;text-align:center">${item.quantity}</span>
              <button onclick="updateQty(${index}, 1)"><i class="fa fa-plus" style="font-size:10px"></i></button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('ticket-total').textContent = `$${total.toFixed(2)}`;
  }

  function updateQty(idx, delta) {
    cart[idx].quantity += delta;
    if(cart[idx].quantity <= 0) cart.splice(idx, 1);
    renderCart();
    input.focus();
  }

  async function processSale() {
    if(cart.length === 0) return;
    
    const entity_id = document.getElementById('f-cliente').value;
    const totalStr = document.getElementById('ticket-total').textContent.replace('$', '');
    
    const payload = {
      tipo: 'Venta',
      estado: 'Completado', // Venta cobrada
      items: cart,
      total: Number(totalStr)
    };
    if (entity_id) payload.entity_id = entity_id;

    try {
      const btn = document.getElementById('btn-pay');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:20px;height:20px;border-width:2px;display:inline-block"></span>';

      const res = await apiFetch('/orders', {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      
      alert('¡Venta completada con éxito!');
      cart = [];
      renderCart();
      document.getElementById('f-cliente').value = '';
      
    } catch(e) {
      alert('Error en Venta: ' + e.message);
    } finally {
      const btn = document.getElementById('btn-pay');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa fa-credit-card"></i> Cobrar e Imprimir';
      input.focus();
    }
  }
</script>
</body>
</html>
