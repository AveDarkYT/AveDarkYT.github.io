<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>InventarioPro | Punto de Venta (POS)</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <!-- Custom Styles -->
    <link href="../css/styles.css" rel="stylesheet" />
    <style>
        .product-card { width: 100%; height: 180px; text-align: center; margin-bottom: 15px; cursor: pointer; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .product-card:hover { transform: scale(1.05); border-color: #2563eb; }
        .product-img { height: 80px; width: 80px; object-fit: contain; margin: 5px auto; }
        .product-title { font-size: 0.85rem; font-weight: bold; line-height: 1.2; height: 32px; overflow: hidden; }
        .cart-qty-input { width: 40px; text-align: center; border: 1px solid #ccc; border-radius: 4px; padding: 2px; }
    </style>
</head>
<body class="sb-nav-fixed sb-sidenav-toggled">

    <!-- Top Navbar -->
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark" id="topbar">
        <a class="navbar-brand" href="../index.html">
            <i class="fas fa-box-open mr-2"></i> InventarioPro
        </a>
        <button class="btn btn-link btn-sm order-1 order-lg-0 text-white" id="sidebarToggle" href="#"><i class="fas fa-bars"></i></button>
        <ul class="navbar-nav ml-auto">
            <li class="nav-item">
                <a class="nav-link text-white" href="../index.html"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
            </li>
        </ul>
    </nav>

    <div id="layoutSidenav">
        <!-- Main Content -->
        <div id="layoutSidenav_content" style="padding-left: 0;">
            <main>
                <div class="container-fluid mt-4">
                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a href="../index.html">Dashboard</a></li>
                        <li class="breadcrumb-item active">Punto de Venta</li>
                    </ol>

                    <div class="row mb-4">
                        <!-- Left Side: Cart -->
                        <div class="card col-lg-5 border-primary shadow mb-4 mb-lg-0">
                            <div class="card-header text-primary d-flex justify-content-between align-items-center">
                                <div><i class="fas fa-shopping-cart"></i> <b>Orden Actual</b></div>
                                <button class="btn btn-sm btn-primary text-white" id="addCustomerBtn"><i class="fas fa-user-plus"></i> Cliente</button>
                            </div>
                            <div class="card-body p-2">
                                <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                                    <table class="table table-sm table-striped">
                                        <thead>
                                            <tr>
                                                <th scope="col">Nombre</th>
                                                <th scope="col">Cant.</th>
                                                <th scope="col">Precio</th>
                                                <th scope="col">Total</th>
                                                <th scope="col">Acción</th>
                                            </tr>
                                        </thead>
                                        <tbody id="cartTableBody">
                                            <tr><td colspan="5" class="text-center text-muted">El carrito está vacío</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                                <hr>
                            </div>
                            <div class="card-footer bg-white p-2">
                                <ul class="list-group mb-3">
                                    <li class="list-group-item d-flex justify-content-between align-items-center py-1">
                                        Cantidad Total: <strong id="totalQty">0</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between align-items-center py-1">
                                        Subtotal: <strong id="subTotal">RD$ 0.00</strong>
                                    </li>
                                    <li class="list-group-item d-flex justify-content-between align-items-center py-1 text-primary">
                                        Total a Pagar: <strong id="grandTotal" style="font-size: 1.2rem;">RD$ 0.00</strong>
                                    </li>
                                </ul>

                                <form id="checkoutForm">
                                    <div class="form-group mb-2">
                                        <label class="small font-weight-bold">Cliente</label>
                                        <select class="form-control form-control-sm" id="customerSelect">
                                            <option value="">Cliente General</option>
                                        </select>
                                    </div>
                                    <div class="row">
                                        <div class="col-6 form-group mb-2">
                                            <label class="small font-weight-bold">Pago Recibido</label>
                                            <input type="number" class="form-control form-control-sm" id="payAmount" value="0" min="0">
                                        </div>
                                        <div class="col-6 form-group mb-2">
                                            <label class="small font-weight-bold">Cambio</label>
                                            <input type="text" class="form-control form-control-sm text-danger" id="changeAmount" readonly value="RD$ 0.00">
                                        </div>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label class="small font-weight-bold">Método de Pago</label>
                                        <select class="form-control form-control-sm" id="payMethod">
                                            <option value="Efectivo">Efectivo</option>
                                            <option value="Tarjeta">Tarjeta</option>
                                            <option value="Transferencia">Transferencia</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-success btn-block" id="btnSubmitOrder"><i class="fas fa-check-circle"></i> Procesar Venta</button>
                                </form>
                            </div>
                        </div>

                        <!-- Right Side: Products -->
                        <div class="card col-lg-7 border-primary">
                            <div class="card-header text-primary">
                                <i class="fas fa-boxes"></i> <b>Catálogo de Productos</b>
                            </div>
                            <div class="card-body">
                                <ul class="nav nav-pills mb-3" id="categoryPills">
                                    <li class="nav-item">
                                        <a class="nav-link active" data-category="all" href="#">Todos los Productos</a>
                                    </li>
                                    <!-- Categorías generadas por JS -->
                                </ul>

                                <input type="text" id="searchProduct" class="form-control mb-3" placeholder="Buscar producto por nombre o código...">

                                <div class="row" id="productsGrid">
                                    <div class="col-12 text-center py-5">
                                        <div class="spinner-border text-primary" role="status"></div>
                                        <p class="mt-2 text-muted">Cargando productos...</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/pos.js"></script>
</body>
</html>
