<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stockly | Compras</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <div class="app-shell">
    
    <!-- Top Navbar -->
    <header class="navbar">
      <div class="nav-left">
        <a href="../index.html" class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-box-open"></i>
          </div>
          <span>Stockly</span>
        </a>
        <nav class="nav-links">
          <a href="../index.html" class="nav-item">Dashboard</a>
          <a href="inventario.html" class="nav-item">Inventario</a>
          <a href="compras.html" class="nav-item active">Compras</a>
          <a href="pos.html" class="nav-item">Punto de Venta</a>
          <a href="proveedores.html" class="nav-item">Proveedores</a>
        </nav>
      </div>
      
      <div class="nav-right">
        <button style="color: var(--text-muted); font-size: 1.25rem;"><i class="fa-regular fa-bell"></i></button>
        <div style="position: relative;">
          <button class="avatar-btn" onclick="document.getElementById('user-menu').classList.toggle('open')">U</button>
          <div id="user-menu" style="display:none; position: absolute; top: 100%; right: 0; margin-top: 0.5rem; width: 200px; background: white; border: 1px solid var(--card-border); border-radius: var(--radius-md); box-shadow: var(--card-shadow); padding: 0.5rem 0;">
            <a href="#" style="display: block; padding: 0.5rem 1rem; font-size: 0.875rem; color: var(--status-red);" onclick="logout()">Logout</a>
          </div>
        </div>
      </div>
    </header>

    <main class="main-content">
      
      <!-- Page Header -->
      <div class="section-header" style="justify-content: space-between; align-items: center; width: 100%;">
        <div style="display: flex; gap: 1rem; align-items: center;">
          <div class="section-icon-wrap" style="background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.05)); color: var(--status-green); border-color: rgba(16,185,129,0.2);">
            <i class="fa-solid fa-cart-arrow-down"></i>
          </div>
          <div>
            <h2 class="section-title">Recepciones de Compra</h2>
            <p class="section-desc">Registra las entradas de inventario desde tus proveedores.</p>
          </div>
        </div>
        <div>
          <button class="btn btn-blue" onclick="openModal('compra-modal')">
            <i class="fa-solid fa-plus"></i> Nueva Compra
          </button>
        </div>
      </div>

      <!-- Table Card -->
      <div class="table-wrapper">
        <div class="table-header">
          <h3 style="font-size: 1rem;">Historial de Compras</h3>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID Compra</th>
              <th>Fecha</th>
              <th>Proveedor</th>
              <th>Total</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="compras-tbody">
            <!-- JS Data -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal: Crear Compra -->
  <div class="modal-overlay" id="compra-modal">
    <div class="modal-box" style="max-width: 600px;">
      <div class="modal-header">
        <h3><i class="fa-solid fa-cart-plus" style="color: var(--primary-color); margin-right: 0.5rem;"></i> Registrar Compra</h3>
        <button class="btn-close" onclick="closeModal('compra-modal')"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <form id="compra-form">
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Proveedor *</label>
            <select id="comp-proveedor" class="form-control" required>
              <option value="">Seleccione un proveedor</option>
              <option value="1">Global Imports</option>
              <option value="2">Tech Distribuidores</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Documento/Factura</label>
            <input type="text" id="comp-factura" class="form-control">
          </div>
        </div>

        <!-- Fake table for products to buy -->
        <div style="margin: 1.5rem 0; border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 1rem;">
          <p style="font-size: 0.875rem; font-weight: 600; margin-bottom: 1rem;">Productos a ingresar</p>
          <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
            <input type="text" class="form-control" placeholder="Buscar por SKU..." style="flex:1;">
            <button type="button" class="btn btn-outline"><i class="fa-solid fa-search"></i></button>
          </div>
          <div style="font-size: 0.875rem; color: var(--text-muted); text-align: center; padding: 2rem 0; background: #f8fafc; border-radius: var(--radius-md);">
            Agregue productos a la orden de compra
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
          <button type="button" class="btn btn-outline" onclick="closeModal('compra-modal')">Cancelar</button>
          <button type="button" class="btn btn-blue" onclick="closeModal('compra-modal')">Procesar Ingreso</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('user-menu');
      if (e.target.closest('.avatar-btn')) {
        menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
      } else if (!e.target.closest('#user-menu')) {
        menu.style.display = 'none';
      }
    });

    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    // Fake data render
    function cargarCompras() {
      const tbody = document.getElementById('compras-tbody');
      tbody.innerHTML = `
        <tr>
          <td style="font-weight: 500; color: var(--primary-color);">#REC-00125</td>
          <td style="color: var(--text-muted);">2026-07-21</td>
          <td style="font-weight: 500;">Global Imports</td>
          <td style="font-weight: 600;">$1,250.00</td>
          <td><span class="badge badge-green">Completado</span></td>
        </tr>
        <tr>
          <td style="font-weight: 500; color: var(--primary-color);">#REC-00124</td>
          <td style="color: var(--text-muted);">2026-07-19</td>
          <td style="font-weight: 500;">Tech Distribuidores</td>
          <td style="font-weight: 600;">$890.50</td>
          <td><span class="badge badge-green">Completado</span></td>
        </tr>
      `;
    }

    cargarCompras();
  </script>
</body>
</html>
