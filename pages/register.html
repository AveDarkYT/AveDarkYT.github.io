<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InventarioPro | Crear Cuenta</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    /* Estilos específicos de Tailwind traducidos para Register */
    body {
      background-color: #f8fafc; /* slate-50 */
      color: #0f172a; /* slate-900 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: none;
    }
    
    .register-card {
      background: white;
      border-radius: 0.75rem; /* rounded-xl */
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); /* shadow-md */
      width: 100%;
      max-width: 28rem; /* max-w-md */
      padding: 2.5rem 2rem; /* p-10 px-8 */
      border: 1px solid #e2e8f0; /* border-slate-200 */
    }

    .register-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .register-header h1 {
      font-size: 1.5rem; /* text-2xl */
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    .register-header p {
      color: #64748b; /* slate-500 */
      font-size: 0.875rem; /* text-sm */
    }

    .form-group-tw {
      margin-bottom: 1.25rem;
    }

    .form-label-tw {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #334155; /* slate-700 */
      margin-bottom: 0.5rem;
    }

    .form-control-tw {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border-radius: 0.5rem; /* rounded-lg */
      border: 1px solid #cbd5e1; /* border-slate-300 */
      background: white;
      color: #0f172a;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .form-control-tw:focus {
      outline: none;
      border-color: #3b82f6; /* blue-500 */
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn-tw {
      width: 100%;
      background: #0f172a; /* slate-900 */
      color: white;
      font-weight: 600;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn-tw:hover {
      background: #1e293b; /* slate-800 */
    }

    .btn-tw:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #64748b;
    }

    .footer-text a {
      color: #3b82f6;
      font-weight: 500;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }

    .alert-error {
      background: #fef2f2; /* red-50 */
      color: #991b1b; /* red-800 */
      border: 1px solid #fecaca; /* red-200 */
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      display: none;
    }
    .alert-error.show {
      display: block;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="register-header">
      <div style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:#3b82f6;color:white;border-radius:12px;margin-bottom:16px;box-shadow:0 4px 14px rgba(59,130,246,0.4)">
        <i class="fa fa-box-open" style="font-size:20px"></i>
      </div>
      <h1>Crear una cuenta</h1>
      <p>Comienza a gestionar tu inventario hoy mismo</p>
    </div>

    <div id="error-alert" class="alert-error">
      <!-- Mensaje de error aquí -->
    </div>

    <form id="register-form">
      <div class="form-group-tw">
        <label class="form-label-tw" for="f-name">Nombre completo</label>
        <input type="text" id="f-name" class="form-control-tw" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group-tw">
        <label class="form-label-tw" for="f-email">Correo electrónico</label>
        <input type="email" id="f-email" class="form-control-tw" placeholder="juan@ejemplo.com" required>
      </div>

      <div class="form-group-tw">
        <label class="form-label-tw" for="f-password">Contraseña</label>
        <input type="password" id="f-password" class="form-control-tw" placeholder="Mínimo 6 caracteres" required minlength="6">
      </div>

      <button type="submit" class="btn-tw" id="btn-submit">
        <span>Crear cuenta</span>
        <i class="fa fa-arrow-right"></i>
      </button>
    </form>

    <div class="footer-text">
      ¿Ya tienes una cuenta? <a href="../index.html">Inicia sesión</a>
    </div>
  </div>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btn-submit');
      const errorAlert = document.getElementById('error-alert');
      const name = document.getElementById('f-name').value.trim();
      const email = document.getElementById('f-email').value.trim();
      const password = document.getElementById('f-password').value;

      errorAlert.classList.remove('show');
      errorAlert.textContent = '';
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Registrando...';

      try {
        const baseUrl = 'http://localhost:3001'; // Ajustar en prod
        const response = await fetch(`${baseUrl}/api/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre: name, email, password, rol: 'admin' }) // El repo de ref crea admins por defecto
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || data.message || 'Error al registrar usuario');
        }

        // Guardar token y redirigir
        localStorage.setItem('token', data.data.token);
        localStorage.setItem('user', JSON.stringify(data.data.usuario));
        
        window.location.href = '../index.html';
      } catch (err) {
        errorAlert.textContent = err.message;
        errorAlert.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Crear cuenta</span> <i class="fa fa-arrow-right"></i>';
      }
    });
  </script>
</body>
</html>
