<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - InventarioPro</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-darker);
    }
    .register-container {
      background-color: var(--bg-dark);
      padding: 2.5rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border-color);
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo i {
      font-size: 2.5rem;
      color: var(--primary-color);
      margin-bottom: 0.5rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: var(--border-radius);
      background-color: var(--bg-darker);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }
    .btn-register {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-register:hover {
      background-color: var(--secondary-color);
    }
    .error-message {
      color: var(--danger-color);
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .back-login {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .back-login:hover {
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="logo">
      <i class="fas fa-user-plus"></i>
      <h2>Registro Nuevo</h2>
      <p class="text-secondary">Crea tu cuenta de administrador</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label>Nombre Completo</label>
        <input type="text" id="nombre" class="form-control" required placeholder="Juan Pérez">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="********">
      </div>
      <button type="submit" class="btn-register">
        <i class="fas fa-check-circle"></i> Registrarme y Entrar
      </button>
      <div id="errorMsg" class="error-message"></div>
    </form>
    
    <a href="index.html" class="back-login">Volver al inicio de sesión</a>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
