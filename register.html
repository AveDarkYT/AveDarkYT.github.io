<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - InventarioPro</title>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root {
      /* Paleta de colores profesional */
      --bg-darker: #0B1015;
      --bg-card: #111820;
      --border-color: #2C3E50;
      --primary-color: #3498DB;
      --primary-hover: #2980B9;
      --text-primary: #FDFEFE;
      --text-secondary: #85929E;
      --danger-color: #E74C3C;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle at top, #17202A 0%, var(--bg-darker) 100%);
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
    }

    .register-container {
      background-color: var(--bg-card);
      padding: 2.5rem 2rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }

    /* Pequeño detalle de color en la parte superior de la tarjeta */
    .register-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--primary-color);
    }

    .logo {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo i {
      font-size: 2.8rem;
      color: var(--primary-color);
      margin-bottom: 0.8rem;
      text-shadow: 0 0 15px rgba(52, 152, 219, 0.3);
    }

    .logo h2 {
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
    }

    .logo p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 0.2rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Contenedor para el input y el ícono */
    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .form-control {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.5rem; /* Espacio extra a la izquierda para el ícono */
      border-radius: 8px;
      background-color: var(--bg-darker);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
    }

    /* Efecto al hacer clic en el input */
    .form-control:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.15);
    }

    .form-control:focus + i, 
    .input-wrapper:focus-within i {
      color: var(--primary-color);
    }

    .btn-register {
      width: 100%;
      padding: 0.9rem;
      margin-top: 1rem;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-register:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }

    .error-message {
      color: var(--danger-color);
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .back-login {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.3s;
    }

    .back-login:hover {
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="logo">
      <i class="fas fa-box-open"></i>
      <h2>InventarioPro</h2>
      <p>Crea tu cuenta de administrador</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label>Nombre Completo</label>
        <div class="input-wrapper">
          <input type="text" id="nombre" class="form-control" required placeholder="Ej. Juan Pérez">
          <i class="fas fa-user"></i>
        </div>
      </div>
      
      <div class="form-group">
        <label>Correo Electrónico</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-control" required placeholder="tu@email.com">
          <i class="fas fa-envelope"></i>
        </div>
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
          <i class="fas fa-lock"></i>
        </div>
      </div>

      <button type="submit" class="btn-register">
        Registrarme y Entrar <i class="fas fa-arrow-right"></i>
      </button>
      
      <div id="errorMsg" class="error-message"></div>
    </form>
    
    <a href="index.html" class="back-login">¿Ya tienes cuenta? Inicia sesión aquí</a>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
